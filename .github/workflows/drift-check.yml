name: Weekly Drift Check

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 09:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install boto3 pandas "evidently==0.4.33"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Run drift check
        run: |
          python src/monitoring/drift_check.py \
            --reference data/reference_predictions.csv \
            --hours 168 \
            --output reports/drift_report.html

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift_report.html
