name: Drift Check (Manual Only)

# Removed scheduled cron — runs only when manually triggered.
# The drift_check.py script remains in src/monitoring/ and runs locally.
on:
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 pandas "evidently==0.4.33"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - run: |
          python src/monitoring/drift_check.py \
            --reference data/reference_predictions.csv \
            --hours 168 \
            --output reports/drift_report.html
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift_report.html
